[project]
name = "codex-pet"
version = "1.0.0"
description = "桌面宠物:电量条小人实时显示 Codex/ChatGPT Plus 配额"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyqt6>=6.11.0",
]

[project.scripts]
codex-pet = "codex_pet:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"
